name: integration

# Executes the real Step Functions definition against LocalStack with stub worker/lifecycle
# Lambdas. Runs only when the orchestration or the handlers change; slower than `ci`.

on:
  pull_request:
    paths:
      - "statemachine/**"
      - "src/grumpycat/handlers/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "statemachine/**"
      - "src/grumpycat/handlers/**"
      - "tests/integration/**"

permissions:
  contents: read

jobs:
  statemachine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        # 4.9.x is the last line that runs without a license token.
        image: localstack/localstack:4.9.2
        ports: ["4566:4566"]
        env:
          SERVICES: stepfunctions,lambda,dynamodb,iam,sts,logs
          LAMBDA_DOCKER_NETWORK: bridge
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --group dev
      - name: wait for step functions
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:4566/_localstack/health | grep -q '"stepfunctions"' && exit 0
            sleep 3
          done
          echo "localstack not ready" >&2; exit 1
      - run: uv run pytest tests/integration -m integration -p no:cacheprovider -v
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
