name: release

# On a vX.Y.Z tag: build multi-arch Lambda and worker images, push to Amazon ECR Public via
# OIDC (no static AWS keys), sign with cosign (keyless), attach an SBOM, and open a draft
# GitHub release with the digests. Secrets/vars needed in the repo:
#   vars.AWS_RELEASE_ROLE_ARN   IAM role trusting this repo's OIDC provider (ecr-public push)
#   vars.ECR_PUBLIC_ALIAS       e.g. a1b2c3d4  (public.ecr.aws/<alias>/...)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # draft release
  id-token: write   # OIDC for AWS and cosign keyless
  packages: read

env:
  REGISTRY: public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [lambda, worker]
    outputs:
      lambda_digest: ${{ steps.digest.outputs.lambda }}
      worker_digest: ${{ steps.digest.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1   # ECR Public lives in us-east-1
      - name: Login to ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/grumpycat-${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/grumpycat-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - id: digest
        run: echo "${{ matrix.image }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release with digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          body="## Images
          | image | reference |
          |---|---|
          | lambda | \`${REGISTRY}/grumpycat-lambda:${tag}@${{ needs.images.outputs.lambda_digest }}\` |
          | worker | \`${REGISTRY}/grumpycat-worker:${tag}@${{ needs.images.outputs.worker_digest }}\` |

          Verify: \`cosign verify --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com <ref>\`"
          gh release create "$tag" --draft --title "$tag" --notes "$body"
