# Grumpycat CI. Runs on every push; publishes images only on vX.Y.Z tags (later step).
# Keep this file free of anything that identifies the organisation hosting the agents.
env:
  UV_IMAGE: "ghcr.io/astral-sh/uv:python3.14-bookworm-slim"

steps:
  - label: ":lint-roller: lint"
    key: lint
    agents:
      queue: arm64
    plugins:
      - docker#v5.13.0:
          image: "$UV_IMAGE"
          entrypoint: ""
          command: ["sh", "-ec", "uv sync --frozen --quiet && uv run ruff check src tests && uv run ruff format --check src tests"]

  - label: ":mypy: types"
    key: types
    agents:
      queue: arm64
    plugins:
      - docker#v5.13.0:
          image: "$UV_IMAGE"
          entrypoint: ""
          command: ["sh", "-ec", "uv sync --frozen --quiet && uv run mypy"]

  - label: ":pytest: tests"
    key: tests
    agents:
      queue: arm64
    plugins:
      - docker#v5.13.0:
          image: "$UV_IMAGE"
          entrypoint: ""
          command: ["sh", "-ec", "uv sync --frozen --quiet && uv run pytest --junitxml=junit.xml"]
    artifact_paths: ["junit.xml"]
